services:
  db:
    image: postgres:16
    container_name: wymnet-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wymnet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wymnet-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data: